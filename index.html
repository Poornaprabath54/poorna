<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Borra Pardhu | Animated Portfolio Slideshow</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* main container */
    .portfolio-container {
      max-width: 1300px;
      width: 100%;
      background: rgba(18, 25, 45, 0.55);
      backdrop-filter: blur(3px);
      border-radius: 3rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
    }

    /* slide wrapper */
    .slideshow {
      position: relative;
      width: 100%;
      min-height: 550px;
      perspective: 1200px;
    }

    .slide {
      background: radial-gradient(circle at 10% 20%, rgba(255,255,245,0.1), rgba(10,20,40,0.7));
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      animation: fadeGlow 0.8s ease-out;
    }

    @keyframes fadeGlow {
      0% { opacity: 0; transform: translateY(30px) scale(0.96); filter: blur(4px);}
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0);}
    }

    /* colorful headers */
    h1, h2, h3 {
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .slide-title {
      font-size: 2.4rem;
      background: linear-gradient(135deg, #FFD166, #FF6B6B, #4ECDC4, #9B5DE5);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientFlow 5s ease infinite;
      margin-bottom: 1.5rem;
      display: inline-block;
      border-left: 5px solid #FFD166;
      padding-left: 1.2rem;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%;}
      50% { background-position: 100% 50%;}
      100% { background-position: 0% 50%;}
    }

    /* card & grid styling */
    .resume-grid, .skills-grid, .extra-grid, .enhance-list, .ai-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.2rem;
      margin-top: 1rem;
    }

    .info-card {
      background: rgba(15, 25, 45, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 1.8rem;
      padding: 1.2rem 1.4rem;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,215,0,0.3);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .info-card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: #FFB347;
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.5);
      background: rgba(30, 45, 75, 0.8);
    }

    .info-card i {
      color: #FFD166;
      font-size: 1.8rem;
      margin-right: 0.7rem;
    }

    .badge {
      background: linear-gradient(120deg, #FF6B6B, #FF8E53);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 0.8rem;
    }

    /* navigation */
    .nav-controls {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255,255,240,0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,209,102,0.5);
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      font-weight: 600;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn:hover {
      background: #FFB347;
      color: #0a0f1e;
      border-color: white;
      transform: scale(1.03);
      box-shadow: 0 0 12px rgba(255,180,70,0.6);
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 1.5rem 0 0.5rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 20px;
      background: rgba(255,255,200,0.4);
      cursor: pointer;
      transition: 0.2s;
    }

    .dot.active {
      background: #FFD166;
      width: 30px;
      box-shadow: 0 0 10px #FFB347;
    }

    /* certificate image simulation */
    .cert-sim {
      background: linear-gradient(145deg, #1e2a3a, #0f1722);
      border-radius: 1.5rem;
      padding: 1rem;
      text-align: center;
      border: 1px dashed gold;
    }

    .cert-icon {
      font-size: 4rem;
      color: #FFD966;
      margin-bottom: 0.5rem;
    }

    /* animated floating */
    @keyframes floatSoft {
      0% { transform: translateY(0px);}
      100% { transform: translateY(-5px);}
    }

    .photo-placeholder {
      width: 120px;
      height: 120px;
      background: linear-gradient(145deg, #3b4b6e, #1f2a44);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      border: 3px solid #FFD166;
      box-shadow: 0 0 20px rgba(255,209,102,0.5);
      margin-bottom: 1rem;
      animation: floatSoft 3s infinite alternate;
    }

    .btn-download {
      background: none;
      border: none;
      color: white;
      margin-left: 10px;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    @media (max-width: 680px) {
      .portfolio-container { padding: 1rem; }
      .slide-title { font-size: 1.7rem; }
      .slide { padding: 1.3rem; }
    }
  </style>
</head>
<body>
<div class="portfolio-container">
  <div class="slideshow" id="slideshowRoot">
    <!-- slides will be injected via js -->
  </div>
  <div class="dots" id="dotsContainer"></div>
  <div class="nav-controls">
    <button class="nav-btn" id="prevSlideBtn"><i class="fas fa-arrow-left"></i> Previous</button>
    <button class="nav-btn" id="nextSlideBtn">Next <i class="fas fa-arrow-right"></i></button>
  </div>
  <footer>
    <i class="fas fa-magic"></i> Animated Portfolio | Borra Pardhu | AI Powered Design
  </footer>
</div>

<script>
  // ========== SLIDES DATA (6 slides exactly) ==========
  const slidesData = [
    { // Slide 1 - Personal Statement
      title: "✨ Personal Statement",
      content: `
        <div style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: center;">

          </div>
          <div style="flex:2">
            <h3 style="color:#FFE6A7; margin-bottom: 1rem;">👋 Hello, I'm Borra Pardhu</h3>
            <p style="font-size:1.1rem; line-height:1.4;">Motivated IT student passionate about <strong class="highlight" style="color:#FFD966;">web development & AI tools</strong>. I aim to become a smart web designer who builds future-ready solutions. I love solving problems, learning new tech, and working with creative teams.</p>
            <div style="margin-top: 1.2rem;"><i class="fas fa-rocket" style="color:#FFB347;"></i> <strong>Career Goal:</strong> Innovate using AI & web technologies</div>
            <div><i class="fas fa-heart" style="color:#FF6B6B;"></i> <strong>Interests:</strong> Coding, AI design, reading tech blogs</div>
          </div>
        </div>
      `
    },
    { // Slide 2 - Resume / CV
      title: "📄 Resume / CV",
      content: `
        <div class="resume-grid">
          <div class="info-card"><i class="fas fa-user-graduate"></i> <strong>Education</strong><br>B.Tech (IT) – 82.3%<br>Intermediate (MPC) – 92.4% (2025)<br>SSC – 84% (2025)</div>
          <div class="info-card"><i class="fas fa-code"></i> <strong>Tech Skills</strong><br>C, MS Office, Excel<br>Web Design (AI Tools)</div>
          <div class="info-card"><i class="fas fa-comments"></i> <strong>Soft Skills</strong><br>Communication, Teamwork, Problem solving</div>
          <div class="info-card"><i class="fas fa-language"></i> <strong>Languages</strong><br>Telugu, English, Hindi</div>
          <div class="info-card"><i class="fas fa-envelope"></i> <strong>Contact</strong><br>📧 pardhuborra018@gmail.com<br>📞 7842554591</div>
          <div class="info-card"><i class="fas fa-map-marker-alt"></i> <strong>Location</strong><br>Andhra Pradesh, India</div>
        </div>
      `
    },
    { // Slide 3 - Evidence of Growth & Skills
      title: "📈 Evidence of Growth & Skills",
      content: `
        <div class="skills-grid">
          <div class="info-card"><i class="fab fa-cuttlefish"></i> <strong>C Programming</strong><div class="progress" style="background:#2a3a55; border-radius:20px; margin-top:6px;"><div style="width:85%; background:#FFB347; border-radius:20px; padding:3px 0;"></div></div> Problem solving & logic</div>
          <div class="info-card"><i class="fas fa-file-excel"></i> <strong>MS Office & Excel</strong><div style="background:#2a3a55; border-radius:20px; margin-top:6px;"><div style="width:80%; background:#4ECDC4; border-radius:20px; padding:3px 0;"></div></div> Data handling & docs</div>
          <div class="info-card"><i class="fas fa-globe"></i> <strong>Web Designing (AI tools)</strong><div style="background:#2a3a55; border-radius:20px; margin-top:6px;"><div style="width:75%; background:#9B5DE5; border-radius:20px; padding:3px 0;"></div></div> Smart web layout</div>
          <div class="info-card"><i class="fas fa-brain"></i> <strong>AI Tools for Dev</strong><div style="background:#2a3a55; border-radius:20px; margin-top:6px;"><div style="width:70%; background:#FF6B6B; border-radius:20px; padding:3px 0;"></div></div> Workshop certified</div>
          <div class="info-card"><i class="fas fa-users"></i> <strong>Teamwork & Communication</strong><div>Active collaboration in college projects</div></div>
        </div>
        <p style="margin-top: 1rem; font-size:0.9rem;"><i class="fas fa-chart-line" style="color:#FFD166;"></i> From basic coding to AI-assisted web design — consistent growth!</p>
      `
    },
    { // Slide 4 - Extra Curricular Works (certificate)
      title: "🏆 Extra Curricular & Workshops",
      content: `
        <div class="extra-grid">
          <div class="info-card" style="grid-column: span 2;">
            <i class="fas fa-certificate" style="font-size:2rem;"></i>
            <h3>✨ 2-Day Workshop on "Smart Web Design using AI Tools"</h3>
            <p><strong>Dates:</strong> 26-02-2026 to 27-02-2026<br>
            <strong>Organized by:</strong> Dept. of IT & Brainovision Solutions India Pvt. Ltd.<br>
            <strong>Venue:</strong> Gudlavalleru Engineering College</p>
            <div class="cert-sim">
              <div class="cert-icon"><i class="fas fa-award"></i> <i class="fas fa-laptop-code"></i></div>
              <p style="font-weight:600;">✔ Participation Certificate Earned</p>
              <span style="background:gold; color:#111; border-radius: 20px; padding: 4px 12px;">Hands-on AI web design</span>
            </div>
          </div>
          <div class="info-card"><i class="fas fa-microphone-alt"></i> <strong>Technical Events</strong><br>Active participant in college fests & coding quizzes</div>
          <div class="info-card"><i class="fas fa-hands-helping"></i> <strong>Community</strong><br>Volunteer for tech awareness drives</div>
        </div>
      `
    },
    { // Slide 5 - Additional Enhancements (personal projects)
      title: "🚀 Additional Enhancements",
      content: `
        <div class="enhance-list" style="display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap:1rem;">
          <div class="info-card"><i class="fas fa-file-alt"></i> <strong>Resume & Portfolio</strong><br>Designed professional resume and this animated portfolio.</div>
          <div class="info-card"><i class="fas fa-robot"></i> <strong>AI tools exploration</strong><br>Used ChatGPT, Canva AI for content & layouts.</div>
          <div class="info-card"><i class="fas fa-code-branch"></i> <strong>Website practice</strong><br>Built basic website layouts with HTML/CSS and AI assistance.</div>
          <div class="info-card"><i class="fas fa-blog"></i> <strong>Future blog plan</strong><br>Planning to launch personal blog on web design tips.</div>
          <div class="info-card"><i class="fas fa-video"></i> <strong>Multimedia</strong><br>Creating short demo reels of projects.</div>
        </div>
        <div class="badge" style="margin-top: 1rem;"><i class="fas fa-lightbulb"></i> Always learning, always building</div>
      `
    },
    { // Slide 6 - AI Tools Used
      title: "🤖 AI Tools Used",
      content: `
        <div class="ai-grid" style="display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: center;">
          <div class="info-card" style="text-align:center; width:160px;"><i class="fab fa-canva" style="font-size:3rem;"></i><br><strong>Canva</strong><br>Slide design & graphics</div>
          <div class="info-card" style="text-align:center; width:160px;"><i class="fab fa-google"></i><br><strong>Google Sites</strong><br>Online portfolio (future)</div>
          <div class="info-card" style="text-align:center; width:160px;"><i class="fas fa-comment-dots"></i><br><strong>ChatGPT</strong><br>Content structuring</div>
          <div class="info-card" style="text-align:center; width:160px;"><i class="fab fa-wix"></i><br><strong>Wix</strong><br>(Upcoming website)</div>
          <div class="info-card" style="text-align:center; width:160px;"><i class="fas fa-chalkboard"></i><br><strong>PowerPoint + AI</strong><br>Presentation flow</div>
        </div>
        <p style="margin-top: 1.5rem; text-align:center; background: rgba(0,0,0,0.3); border-radius: 2rem; padding: 0.7rem;"><i class="fas fa-magic"></i> This portfolio was built using HTML/CSS/JS & AI-enhanced animations — fully interactive.</p>
      `
    }
  ];

  let currentIndex = 0;
  const slideshowRoot = document.getElementById('slideshowRoot');
  const dotsContainer = document.getElementById('dotsContainer');

  function renderSlide(index) {
    // wrap index safely
    const safeIndex = (index + slidesData.length) % slidesData.length;
    const slide = slidesData[safeIndex];
    const slideHTML = `
      <div class="slide" key=${safeIndex}>
        <h2 class="slide-title"><i class="fas fa-layer-group"></i> ${slide.title}</h2>
        <div class="slide-content">
          ${slide.content}
        </div>
        <div style="margin-top: 1.2rem; font-size: 0.8rem; opacity:0.7; text-align:right;">
          <i class="fas fa-arrow-circle-right"></i> Slide ${safeIndex+1} / ${slidesData.length}
        </div>
      </div>
    `;
    slideshowRoot.innerHTML = slideHTML;
    updateDots(safeIndex);
    currentIndex = safeIndex;
  }

  function updateDots(activeIdx) {
    dotsContainer.innerHTML = '';
    for (let i = 0; i < slidesData.length; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === activeIdx) dot.classList.add('active');
      dot.addEventListener('click', () => {
        renderSlide(i);
      });
      dotsContainer.appendChild(dot);
    }
  }

  function nextSlide() {
    renderSlide((currentIndex + 1) % slidesData.length);
  }
  function prevSlide() {
    renderSlide((currentIndex - 1 + slidesData.length) % slidesData.length);
  }

  // initial render
  renderSlide(0);

  // attach event listeners
  document.getElementById('nextSlideBtn').addEventListener('click', nextSlide);
  document.getElementById('prevSlideBtn').addEventListener('click', prevSlide);

  // keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  // additional floating animation for any progress bars (fake progress visuals)
  // styling progress bars just as simple indicators
  const style = document.createElement('style');
  style.textContent = `
    .progress div, .skills-grid .info-card div div {
      transition: width 0.5s ease;
    }
    .info-card {
      transition: all 0.25s ease;
    }
    .photo-placeholder i {
      filter: drop-shadow(0 0 6px gold);
    }
    .cert-sim:hover {
      transform: scale(1.01);
      background: radial-gradient(circle, #2e3e55, #111c2c);
    }
  `;
  document.head.appendChild(style);
</script>
</body>
</html>
